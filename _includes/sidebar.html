<aside class="sidebar">
    <!-- Author Widget -->
    <div class="sidebar-widget author-widget">
        <div class="widget-header">
            <h3>Siapalagi Kalau Bukan Admin</h3>
        </div>
        <div class="widget-content">
            <div class="author-avatar">
                <img src="https://ui-avatars.com/api/?name=Admin+ShitNyata&background=ffc107&color=0a192f" alt="Admin">
            </div>
            <p>"Saya menulis bukan untuk dibaca, tapi untuk mengurangi beban pikiran (dan server)."</p>
            <div class="social-links">
                <a href="#">Twitter/X</a>
                <a href="#">IG</a>
            </div>
        </div>
    </div>

    <!-- Category Widget (Optional/Simple) -->
    <div class="sidebar-widget">
        <div class="widget-header">
            <h3>Tulisan Terbaru</h3>
        </div>
        <div class="widget-content">
            <ul class="clean-list">
                {% for post in site.posts limit:5 %}
                <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
                {% endfor %}
            </ul>
        </div>
    </div>

    <!-- Ad Widget Area -->
    {% include ads-sidebar.html %}
</aside>
